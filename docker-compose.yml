services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/change_me
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      LEGAL_CHUNKS_PATH: /app/data/releases/labor-law-2026-07-27-candidate/chunks.jsonl
      CORPUS_RELEASE_MANIFEST_PATH: /app/data/releases/labor-law-2026-07-27-candidate/manifest.json
      CORPUS_RELEASE_ID: labor-law-2026-07-27-candidate
      CORPUS_REQUIRE_AUTHORITY_APPROVAL: "true"
      VNCORENLP_MODEL_DIR: /app/models/vncorenlp
      FASTEMBED_CACHE_DIR: /root/.cache/fastembed
    depends_on:
      - qdrant
      - neo4j
    volumes:
      - ./data:/app/data:ro
      - "${VNCORENLP_HOST_DIR:-../models/vncorenlp}:/app/models/vncorenlp:ro"
      - fastembed_cache:/root/.cache/fastembed

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  fastembed_cache:
