services:
  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labor_law_rag}
      POSTGRES_USER: ${POSTGRES_USER:-labor_law}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-labor_law} -d ${POSTGRES_DB:-labor_law_rag}
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: labor_law_active
      QDRANT_EXPECTED_COLLECTION: labor_law_canonical_word_20260804_fdbec539
      RUNTIME_READINESS_TTL_SECONDS: "30"
      RUNTIME_READINESS_FAILURE_TTL_SECONDS: "5"
      LEGAL_CHUNKS_PATH: /app/data/releases/labor-law-canonical-word-20260804-164432-candidate/canonical_chunks.jsonl
      CORPUS_RELEASE_MANIFEST_PATH: /app/data/releases/labor-law-canonical-word-20260804-164432-candidate/manifest.json
      E5_AUDIT_SUMMARY_PATH: /app/data/releases/labor-law-canonical-word-20260804-164432-candidate/e5_audit/summary.json
      CORPUS_RELEASE_ID: labor-law-canonical-word-20260804-164432-candidate
      CORPUS_REQUIRE_AUTHORITY_APPROVAL: "true"
      RETRIEVAL_EXPECTED_CHUNKS: "804"
      RETRIEVAL_CORPUS_SHA256: fdbec539efbfb3f4aa3cb3962046321e3a402150d93516ef4256934972c70307
      RETRIEVAL_TOP_K: "5"
      RETRIEVAL_CANDIDATE_K: "30"
      HYBRID_RRF_K: "60"
      HYBRID_DENSE_WEIGHT: "0.9"
      HYBRID_SPARSE_WEIGHT: "0.1"
      VNCORENLP_MODEL_DIR: /app/models/vncorenlp
      FASTEMBED_CACHE_DIR: /root/.cache/fastembed
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://labor_law:change_this_local_password@postgres:5432/labor_law_rag}
      DATABASE_AUTO_CREATE: "true"
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - "${VNCORENLP_HOST_DIR:-./models/vncorenlp}:/app/models/vncorenlp:ro"
      - fastembed_cache:/root/.cache/fastembed

  runtime-assets:
    profiles:
      - tools
    build:
      context: ./backend
    environment:
      VNCORENLP_MODEL_DIR: /app/models/vncorenlp
      FASTEMBED_CACHE_DIR: /root/.cache/fastembed
    command:
      - python
      - -m
      - app.cli.prepare_runtime_assets
      - --vncorenlp-dir
      - /app/models/vncorenlp
      - --fastembed-cache-dir
      - /root/.cache/fastembed
    volumes:
      - "${VNCORENLP_HOST_DIR:-./models/vncorenlp}:/app/models/vncorenlp"
      - fastembed_cache:/root/.cache/fastembed

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  fastembed_cache:
