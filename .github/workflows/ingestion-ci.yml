name: VBPL ingestion CI

on:
  push:
    paths:
      - "scripts/vbpl_portal.py"
      - "backend/tests/test_vbpl_ingestion.py"
      - "config/vbpl_corpus.json"
      - "requirements-corpus.txt"
      - ".github/workflows/ingestion-ci.yml"
  pull_request:
    paths:
      - "scripts/vbpl_portal.py"
      - "backend/tests/test_vbpl_ingestion.py"
      - "config/vbpl_corpus.json"
      - "requirements-corpus.txt"
      - ".github/workflows/ingestion-ci.yml"

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ingestion test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-corpus.txt pytest
      - name: Compile crawler
        run: python -m py_compile scripts/vbpl_portal.py
      - name: Run fail-closed ingestion tests
        run: PYTHONPATH=.:backend python -m pytest -q backend/tests/test_vbpl_ingestion.py
