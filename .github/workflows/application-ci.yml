name: Application CI

on:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
      - "config/**"
      - "data/**"
      - ".gitattributes"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "pytest.ini"
      - ".env.example"
      - ".github/workflows/application-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "config/**"
      - "data/**"
      - ".gitattributes"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "pytest.ini"
      - ".env.example"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONPATH: backend
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            default-jdk-headless

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: |
          python -m compileall -q backend/app backend/tests

      - name: Run backend test suite
        run: |
          python -m pytest -q backend/tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  postgres-integration:
    name: PostgreSQL history integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: history_test
          POSTGRES_USER: history_test
          POSTGRES_PASSWORD: history_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U history_test -d history_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PYTHONPATH: backend
      TEST_POSTGRES_URL: postgresql+psycopg://history_test:history_test_password@localhost:5432/history_test
      ALLOW_DESTRUCTIVE_POSTGRES_TEST: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pydantic \
            pydantic-settings \
            sqlalchemy==2.0.43 \
            "psycopg[binary]==3.2.10"

      - name: Run PostgreSQL migration integration test
        run: |
          python -m pytest -q \
            backend/tests/test_conversation_postgres_integration.py

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare non-secret environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Validate Compose configuration
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config >/tmp/docker-compose.resolved.yml

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config --services
